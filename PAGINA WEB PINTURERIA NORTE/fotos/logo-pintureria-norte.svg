<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">Pintureria Norte</title>
  <desc id="desc">Pintura hogar, obra y automotriz</desc>
  <defs>
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f28b52"/>
      <stop offset="1" stop-color="#ce4b2f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#511f2f" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="750" height="180" rx="16" fill="url(#sign)" stroke="#742c37" stroke-width="10"/>
  <text x="34" y="76" fill="#f7eee5" stroke="#445070" stroke-width="3" paint-order="stroke" font-family="Arial, sans-serif" font-weight="900" font-size="49" letter-spacing="1" filter="url(#shadow)">PINTURERIA</text>
  <path d="M34 88h337" stroke="#fff0d8" stroke-width="5"/>
  <text x="385" y="132" fill="#c8bed9" stroke="#34405d" stroke-width="5" paint-order="stroke" font-family="Arial, sans-serif" font-weight="900" font-size="91" letter-spacing="-4" filter="url(#shadow)">NORTE</text>
  <text x="39" y="157" fill="#fff3df" font-family="Arial, sans-serif" font-weight="800" font-size="25" letter-spacing="2">PINTURA HOGAR &#8226; OBRA &#8226; AUTOMOTRIZ</text>
</svg>
